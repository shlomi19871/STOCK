<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Clash</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            direction: rtl;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-controls button {
            background: #34495e;
            color: white;
            border: 1px solid #fff;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
        }
        .header-controls button.active {
            background: #e74c3c;
            border-color: #e74c3c;
        }
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        /* עיצוב הטבלה (סימבול משמאל לימין) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            direction: ltr; /* משמאל לימין */
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left; /* יישור לשמאל בגלל שזה LTR */
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        button.action-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 10px;
        }
        button.action-btn:hover {
            background-color: #2ecc71;
        }
        #userGreeting {
            font-size: 14px;
            margin-left: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h2>Portfolio Clash</h2>
        <div class="header-controls">
            <span id="userGreeting"></span>
            <button class="tab-btn active" id="portfolioTabBtn" onclick="switchTab('portfolio')">תיק השקעות</button>
            <button class="tab-btn" id="loginTabBtn" onclick="switchTab('login')">התחברות / הרשמה</button>
            <button class="tab-btn" id="adminTabBtn" onclick="switchTab('admin')" style="display:none;">ניהול (מנהל)</button>
            <button id="logoutBtn" onclick="logout()" style="display:none;">התנתק</button>
        </div>
    </header>

    <div class="container">
        
        <!-- טאב תיק השקעות -->
        <div id="portfolioTab" class="tab-content active">
            <h3>מעקב מניות מותאם</h3>
            <div id="portfolioMessage" style="color: #e74c3c;">יש להתחבר ולחכות לאישור מנהל כדי לצפות בנתונים.</div>
            
            <div id="portfolioData" style="display:none;">
                <table id="stocksTable">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Current Price</th>
                            <th>Day Change (%)</th>
                            <th>Shares Owned</th>
                            <th>Total Value</th>
                        </tr>
                    </thead>
                    <tbody id="portfolioBody">
                        <!-- נתונים יוזרקו לכאן על ידי JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- טאב התחברות / הרשמה -->
        <div id="loginTab" class="tab-content">
            <h3>כניסה למערכת</h3>
            <div class="form-group">
                <label>אימייל:</label>
                <input type="email" id="authEmail" placeholder="הכנס אימייל">
            </div>
            <div class="form-group">
                <label>סיסמה:</label>
                <input type="password" id="authPassword" placeholder="הכנס סיסמה">
            </div>
            <button class="action-btn" onclick="login()">התחבר</button>
            <button class="action-btn" style="background-color: #2980b9;" onclick="register()">בקש הרשמה חדשה</button>
        </div>

        <!-- טאב ניהול (Admin) -->
        <div id="adminTab" class="tab-content">
            <h3>אישור משתמשים חדשים</h3>
            <table style="direction: rtl;">
                <thead>
                    <tr>
                        <th style="text-align: right;">אימייל</th>
                        <th style="text-align: right;">סטטוס</th>
                        <th style="text-align: right;">פעולה</th>
                    </tr>
                </thead>
                <tbody id="adminUsersBody">
                    <!-- רשימת משתמשים ממתינים תופיע כאן -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. הגדרות FIREBASE (החלף בנתונים שלך!)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // הגדר אימייל של המנהל שיוכל לאשר משתמשים
        const ADMIN_EMAIL = "admin@portfolio-clash.com"; // החלף לאימייל המנהל שלך

        // ==========================================
        // 2. התראות לטלגרם
        // ==========================================
        async function sendTelegramNotification(message) {
            const botToken = 'YOUR_TELEGRAM_BOT_TOKEN'; // שים את הטוקן של הבוט כאן
            const chatId = '1174515533'; 
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            
            if (botToken === 'YOUR_TELEGRAM_BOT_TOKEN') return; // מניעת שגיאה אם הטוקן לא הוזן
            
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message })
                });
            } catch (error) {
                console.error("Telegram notification failed:", error);
            }
        }

        // ==========================================
        // 3. ניהול מצב התחברות (Auth State)
        // ==========================================
        auth.onAuthStateChanged(async (user) => {
            const loginBtn = document.getElementById('loginTabBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const adminBtn = document.getElementById('adminTabBtn');
            const greeting = document.getElementById('userGreeting');
            
            if (user) {
                // המשתמש מחובר במערכת
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                greeting.innerText = `שלום, ${user.email}`;

                // בדיקה אם המשתמש הוא מנהל
                if (user.email === ADMIN_EMAIL) {
                    adminBtn.style.display = 'inline-block';
                    loadAdminPanel();
                } else {
                    adminBtn.style.display = 'none';
                }

                // בדיקת אישור (Approved) מול Firestore
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists && doc.data().approved) {
                        document.getElementById('portfolioMessage').style.display = 'none';
                        document.getElementById('portfolioData').style.display = 'block';
                        loadPortfolioData(); // טעינת המניות
                        switchTab('portfolio');
                    } else {
                        document.getElementById('portfolioMessage').innerText = "חשבונך ממתין לאישור מנהל המערכת.";
                        document.getElementById('portfolioMessage').style.display = 'block';
                        document.getElementById('portfolioData').style.display = 'none';
                    }
                } catch (error) {
                    console.error("שגיאה בקריאת נתוני משתמש:", error);
                }

            } else {
                // משתמש לא מחובר
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
                adminBtn.style.display = 'none';
                greeting.innerText = '';
                document.getElementById('portfolioMessage').innerText = "יש להתחבר ולחכות לאישור מנהל כדי לצפות בנתונים.";
                document.getElementById('portfolioMessage').style.display = 'block';
                document.getElementById('portfolioData').style.display = 'none';
                switchTab('login');
            }
        });

        // ==========================================
        // 4. פונקציות הרשמה והתחברות
        // ==========================================
        async function register() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            
            if (!email || !password) return alert("אנא הזן אימייל וסיסמה.");

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // יצירת רשומה במסד הנתונים
                await db.collection('users').doc(user.uid).set({
                    email: email,
                    approved: false,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // התראת טלגרם
                await sendTelegramNotification(`🔔 בקשת הרשמה חדשה למערכת Portfolio Clash!\nאימייל: ${email}`);

                alert("הרשמתך נקלטה בהצלחה! החשבון ממתין לאישור המנהל.");
                auth.signOut(); // ניתוק עד אישור
                
            } catch (error) {
                alert("שגיאה בהרשמה: " + error.message);
            }
        }

        async function login() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            if (!email || !password) return alert("אנא הזן אימייל וסיסמה.");

            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                alert("שגיאה בהתחברות. בדוק פרטים ונסה שוב.");
            }
        }

        async function logout() {
            await auth.signOut();
        }

        // ==========================================
        // 5. ניהול טאבים (UI)
        // ==========================================
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId + 'Tab').classList.add('active');
            
            const activeBtn = document.getElementById(tabId + 'TabBtn');
            if(activeBtn) activeBtn.classList.add('active');
        }

        // ==========================================
        // 6. פאנל ניהול (משיכה ואישור משתמשים)
        // ==========================================
        function loadAdminPanel() {
            db.collection('users').onSnapshot(snapshot => {
                const tbody = document.getElementById('adminUsersBody');
                tbody.innerHTML = '';
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const statusText = data.approved ? '<span style="color:green">מאושר</span>' : '<span style="color:red">ממתין</span>';
                    const actionBtn = data.approved 
                        ? `<button onclick="toggleUserStatus('${doc.id}', false)">השעה משתמש</button>`
                        : `<button onclick="toggleUserStatus('${doc.id}', true)">אשר משתמש</button>`;

                    tbody.innerHTML += `
                        <tr>
                            <td>${data.email}</td>
                            <td>${statusText}</td>
                            <td>${actionBtn}</td>
                        </tr>
                    `;
                });
            });
        }

        async function toggleUserStatus(userId, isApproved) {
            try {
                await db.collection('users').doc(userId).update({
                    approved: isApproved
                });
            } catch (error) {
                console.error("שגיאה בעדכון סטטוס:", error);
            }
        }

        // ==========================================
        // 7. טעינת נתוני מניות (Mock Data)
        // ==========================================
        function loadPortfolioData() {
            // כאן תוכל לחבר API (כמו Alpha Vantage / Yahoo Finance) או למשוך מה-Firestore
            // בינתיים הנתונים מוקשים פנימה לפי הסדר שביקשת
            const mockData = [
                { symbol: 'AAPL', price: '175.50', change: '+1.2%', shares: '50', total: '8,775' },
                { symbol: 'MSFT', price: '330.10', change: '-0.5%', shares: '20', total: '6,602' },
                { symbol: 'TSLA', price: '215.30', change: '+2.8%', shares: '15', total: '3,229' }
            ];

            const tbody = document.getElementById('portfolioBody');
            tbody.innerHTML = '';
            
            mockData.forEach(stock => {
                const changeColor = stock.change.startsWith('+') ? 'green' : 'red';
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${stock.symbol}</strong></td>
                        <td>$${stock.price}</td>
                        <td style="color: ${changeColor}; font-weight: bold;">${stock.change}</td>
                        <td>${stock.shares}</td>
                        <td>$${stock.total}</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
